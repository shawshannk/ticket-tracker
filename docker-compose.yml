services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ticket_tracker
      POSTGRES_USER: ticket_tracker
      POSTGRES_PASSWORD: dev_only_password
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    # api/migrate wait for readiness, not just for the container to exist.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_tracker -d ticket_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies migrations then exits (spec 09). Seeding stays manual —
  # `docker compose run --rm migrate pnpm run db:seed`.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://ticket_tracker:dev_only_password@postgres:5432/ticket_tracker
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "run", "db:migrate"]

  api:
    # Context is the repo root: the API imports packages/shared via the pnpm workspace.
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://ticket_tracker:dev_only_password@postgres:5432/ticket_tracker
      # Both spellings of the same dev host. CORS matches on the *origin string*, and the browser
      # sends whichever one the address bar used — a stray `pnpm run dev` can hold `localhost:5173`
      # (it binds ::1, which resolves first), leaving `127.0.0.1:5173` as the way to reach this
      # container. Naming only one made every request from the other fail CORS with no clue why.
      WEB_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
      PORT: 3000
      # Required since M16 — the API refuses to boot without it. A fixed value is fine here
      # precisely because this file is development-only; a real deployment must supply its own,
      # and changing it signs everyone out.
      AUTH_JWT_SECRET: compose_dev_only_secret_at_least_32_bytes_long_xxxxx
      # **Off since M21 — the cutover.** v1's X-Acting-User-Id is inert and every route needs a
      # verified token (R11). The AuthGuard branch still exists and can be switched back on for
      # local debugging, but this is the supported configuration and what CI now runs. The API
      # refuses to boot with it enabled under NODE_ENV=production regardless.
      AUTH_DEV_IMPERSONATION: "false"
      # The spec's limit is 10 logins per 15 minutes per ip+email. The e2e suite signs in for
      # real several times per run from one host, so two runs inside the window would trip it and
      # look like a broken login page. Development only — nothing outside Compose sets these, and
      # the defaults in login-rate-limit.ts are the specified values.
      AUTH_LOGIN_RATE_LIMIT: "200"
      NODE_ENV: development
      # M22. Pretty logs here (NODE_ENV is development); production emits JSON.
      LOG_LEVEL: debug
      # Sentry is inert without a DSN, so nothing is sent from a Compose run.
      # SENTRY_DSN:
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports: ["3000:3000"]
    # Compose can now wait for the API the same way it waits for Postgres — liveness only, since
    # readiness failing is a reason to stop sending traffic, not to restart (spec 11 §4).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # The browser resolves this, so it must be the host-published API port.
        VITE_API_URL: http://localhost:3000
    depends_on:
      api:
        condition: service_healthy
    ports: ["5173:5173"]

volumes:
  pgdata:

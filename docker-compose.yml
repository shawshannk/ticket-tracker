services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ticket_tracker
      POSTGRES_USER: ticket_tracker
      POSTGRES_PASSWORD: dev_only_password
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    # api/migrate wait for readiness, not just for the container to exist.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_tracker -d ticket_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies migrations then exits (spec 09). Seeding stays manual —
  # `docker compose run --rm migrate pnpm run db:seed`.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://ticket_tracker:dev_only_password@postgres:5432/ticket_tracker
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "run", "db:migrate"]

  api:
    # Context is the repo root: the API imports packages/shared via the pnpm workspace.
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://ticket_tracker:dev_only_password@postgres:5432/ticket_tracker
      WEB_ORIGIN: http://localhost:5173
      PORT: 3000
      # Required since M16 — the API refuses to boot without it. A fixed value is fine here
      # precisely because this file is development-only; a real deployment must supply its own,
      # and changing it signs everyone out.
      AUTH_JWT_SECRET: compose_dev_only_secret_at_least_32_bytes_long_xxxxx
      # v1's X-Acting-User-Id still works here, which is what keeps the web app usable until
      # M20 ships a login screen. Refused at boot if NODE_ENV=production.
      AUTH_DEV_IMPERSONATION: "true"
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports: ["3000:3000"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # The browser resolves this, so it must be the host-published API port.
        VITE_API_URL: http://localhost:3000
    depends_on: [api]
    ports: ["5173:5173"]

volumes:
  pgdata:

# Security headers for the built SPA (spec 10 §8).
#
# The CSP is not decoration: spec 10 §8 accepts that XSS can use the in-memory access token to
# act as the user for as long as the page is open, and names a strict CSP as *the* mitigation.
# It is therefore part of the deliverable, not a nice-to-have.
#
# `script-src 'self'` with no `unsafe-inline` and no `unsafe-eval` is what makes it worth having.
# Vite's production build emits external module scripts, so nothing here needs an inline script
# allowance. If a future dependency demands one, use a nonce or a hash — adding `unsafe-inline`
# to script-src silently turns this whole header into a comment.
#
# `style-src` *does* allow inline, and that is a deliberate, narrower concession: the app sets
# `style` attributes for role and label colours, which the CSP counts as inline styles. Inline
# styles cannot execute code; inline scripts can. The two are not the same risk.
#
# Google Fonts is allowed for the same reason it is used at all — `index.css` imports IBM Plex
# from it. Two named origins for stylesheets and font files, and nothing else; the alternative
# is self-hosting the faces, which is stricter and better for privacy but is a change to how the
# app is built, not to this file. Left as a known trade-off rather than silently widened.
#
# `connect-src` names the API origin. `__API_ORIGIN__` is replaced at image build time with the
# same VITE_API_URL the bundle was compiled against, so the header and the code cannot disagree.
# Substituted with `sed` in the Dockerfile rather than through nginx's envsubst templates,
# because envsubst would also expand `$uri` in the try_files line below and break routing.
server {
  listen 5173;
  root /usr/share/nginx/html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' __API_ORIGIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  # Clickjacking cover for browsers that predate frame-ancestors.
  add_header X-Frame-Options DENY always;

  # The app is a SPA on TanStack Router: any deep link must serve index.html, or a refresh on
  # /projects/<id>/board would 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}

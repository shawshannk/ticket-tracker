name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # Same credentials the Compose Postgres uses, so local and CI behave identically.
  DATABASE_URL: postgres://ticket_tracker:dev_only_password@localhost:5432/ticket_tracker
  # Required since M16: TokenService refuses to construct without it, so the API cannot boot
  # and the auth integration tests cannot run. Throwaway value — CI holds no real sessions.
  AUTH_JWT_SECRET: ci_only_secret_at_least_32_bytes_long_padding_xxxxx
  # The auth suite switches this off for itself; the e2e suite still needs it on until M20
  # gives the web app a login screen.
  # Off since M21: CI runs the same configuration as a real deployment, so a regression that
  # only shows up without the legacy header fails here rather than in production.
  AUTH_DEV_IMPERSONATION: "false"

jobs:
  # Fast feedback: everything that doesn't need a database.
  verify:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      # Unit suites only — these must not need a database.
      - run: pnpm run test
      - run: pnpm run build

  # The API's integration tests talk to a real Postgres; without this job roughly a third of
  # the backend's coverage (the key-sequence race and the R2 isolation tests) never runs.
  integration:
    name: API integration tests (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ticket_tracker
          POSTGRES_USER: ticket_tracker
          POSTGRES_PASSWORD: dev_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ticket_tracker -d ticket_tracker"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The shared package must be built before the API can import it.
      - run: pnpm --filter @ticket-tracker/shared run build
      - run: pnpm --filter @ticket-tracker/api run db:migrate
      - run: pnpm --filter @ticket-tracker/api run db:seed
      - run: pnpm run test:integration

  # Slower, and deliberately not a gate on the fast checks above (spec 09).
  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    env:
      # The suite signs in for real several times per run (M20), and a retried run doubles that
      # against a limit tuned for humans — 10 per 15 minutes per ip+email, all from one runner.
      # This job is not what proves the limiter works; `auth.int-spec.ts` is, at the real limit.
      AUTH_LOGIN_RATE_LIMIT: '200'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ticket_tracker
          POSTGRES_USER: ticket_tracker
          POSTGRES_PASSWORD: dev_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ticket_tracker -d ticket_tracker"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @ticket-tracker/shared run build
      - run: pnpm --filter @ticket-tracker/api run db:migrate
      # The e2e specs run inside the seeded projects, so seeding is a prerequisite.
      - run: pnpm --filter @ticket-tracker/api run db:seed
      # playwright.config.ts starts `pnpm run dev` itself when CI is set.
      - run: pnpm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The Compose images referenced by docker-compose.yml must actually build.
  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t ticket-tracker-api .
      - run: docker build -f apps/web/Dockerfile -t ticket-tracker-web .
